name: Quality

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agenda_estetica_test
          MYSQL_USER: agenda_estetica_test
          MYSQL_PASSWORD: testing_password
          MYSQL_ROOT_PASSWORD: root_testing_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uagenda_estetica_test -ptesting_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:Zm91bmRhdGlvbi10ZXN0LWtleS1ub3QtcHJvZHVjdGlvbi0xMjM0NTY3ODkw
      APP_URL: http://localhost
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: agenda_estetica_test
      DB_USERNAME: agenda_estetica_test
      DB_PASSWORD: testing_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml, curl, zip, intl
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: php artisan key:generate --force

      - name: Migrate test database
        run: php artisan migrate --force

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Audit Composer dependencies
        run: composer audit

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run Larastan
        run: vendor/bin/phpstan analyse

      - name: Run backend tests
        run: php artisan test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit
