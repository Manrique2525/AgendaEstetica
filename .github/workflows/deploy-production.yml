name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agenda-estetica-production
  cancel-in-progress: false

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agenda_estetica_test
          MYSQL_USER: agenda_estetica_test
          MYSQL_PASSWORD: testing_password
          MYSQL_ROOT_PASSWORD: root_testing_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uagenda_estetica_test -ptesting_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://localhost
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: agenda_estetica_test
      DB_USERNAME: agenda_estetica_test
      DB_PASSWORD: testing_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml, curl, zip, intl
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrate test database
        run: php artisan migrate --force

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Audit Composer dependencies
        run: composer audit

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run Larastan
        run: vendor/bin/phpstan analyse

      - name: Run backend tests
        run: php artisan test

      - name: Check repository whitespace
        run: git diff --check

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to alwaysdata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    environment:
      name: production
      url: https://yaris.alwaysdata.net
    env:
      REMOTE_USER: ${{ secrets.ALWAYSDATA_USER }}
      REMOTE_HOST: ${{ secrets.ALWAYSDATA_HOST }}
      REMOTE_PORT: ${{ secrets.ALWAYSDATA_PORT }}
      APP_ROOT: ${{ secrets.ALWAYSDATA_APP_ROOT || '/home/yaris/apps/agenda-estetica' }}
      DEPLOY_BASE_URL: ${{ secrets.ALWAYSDATA_BASE_URL || 'https://yaris.alwaysdata.net' }}
      ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
      ALWAYSDATA_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
      SSH_KEY_PATH: ${{ runner.temp }}/alwaysdata_deploy_key
      KNOWN_HOSTS_PATH: ${{ runner.temp }}/alwaysdata_known_hosts
      DEPLOYED_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Stage frontend build
        run: |
          set -euo pipefail
          if [[ ! -d frontend-build || -z "$(find frontend-build -type f | head -n1)" ]]; then
            echo "::error::Frontend build artifact is missing or empty"
            exit 1
          fi
          rm -rf public/build
          mkdir -p public/build
          cp -a frontend-build/. public/build/

      - name: Configure SSH access
        run: |
          set -euo pipefail
          umask 077
          : > "$SSH_KEY_PATH"
          printf '%s\n' "$ALWAYSDATA_SSH_KEY" > "$SSH_KEY_PATH"
          : > "$KNOWN_HOSTS_PATH"
          printf '%s\n' "$ALWAYSDATA_KNOWN_HOSTS" > "$KNOWN_HOSTS_PATH"

      - name: Verify deploy configuration
        run: |
          set -euo pipefail
          if [[ -z "$REMOTE_HOST" || -z "$REMOTE_USER" || -z "$REMOTE_PORT" || -z "$ALWAYSDATA_SSH_KEY" || -z "$ALWAYSDATA_KNOWN_HOSTS" ]]; then
            echo "::error::Deploy blocked: configure GitHub Environment 'production' secrets before merging this workflow (ALWAYSDATA_HOST, ALWAYSDATA_USER, ALWAYSDATA_PORT, ALWAYSDATA_SSH_KEY, ALWAYSDATA_KNOWN_HOSTS)."
            exit 1
          fi
          if [[ ! -s "$SSH_KEY_PATH" || ! -s "$KNOWN_HOSTS_PATH" ]]; then
            echo "::error::Deploy blocked: SSH key or known_hosts could not be materialized"
            exit 1
          fi

      - name: Check SSH connectivity
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" -p "$REMOTE_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o LogLevel=ERROR \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$REMOTE_USER@$REMOTE_HOST" \
            "APP_ROOT='$APP_ROOT'" bash -s <<'REMOTE'
          set -euo pipefail
          php -v | head -n1
          composer --version | head -n1
          test -d "$APP_ROOT" || { echo "error: $APP_ROOT missing on server" >&2; exit 1; }
          echo "ssh-connect-ok"
          REMOTE

      - name: Prepare remote directories
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" -p "$REMOTE_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o LogLevel=ERROR \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$REMOTE_USER@$REMOTE_HOST" \
            "APP_ROOT='$APP_ROOT'" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$APP_ROOT"
          mkdir -p storage/app storage/logs bootstrap/cache
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views
          REMOTE

      - name: Sync application files
        run: |
          set -euo pipefail
          rsh="ssh -i '$SSH_KEY_PATH' -p '$REMOTE_PORT' -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o LogLevel=ERROR -o UserKnownHostsFile='$KNOWN_HOSTS_PATH'"
          rsync -azh --omit-dir-times -e "$rsh" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'coverage/' \
            --exclude '.phpunit.cache/' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/' \
            --exclude 'public/hot' \
            --exclude '.gitignore' \
            --exclude '.editorconfig' \
            --exclude '.DS_Store' \
            --exclude 'AGENTS.md' \
            --exclude 'README.md' \
            ./ "$REMOTE_USER@$REMOTE_HOST:$APP_ROOT/"

      - name: Install production dependencies
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" -p "$REMOTE_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o LogLevel=ERROR \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$REMOTE_USER@$REMOTE_HOST" \
            "APP_ROOT='$APP_ROOT'" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$APP_ROOT"
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          composer check-platform-reqs
          REMOTE

      - name: Verify application environment
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" -p "$REMOTE_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o LogLevel=ERROR \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$REMOTE_USER@$REMOTE_HOST" \
            "APP_ROOT='$APP_ROOT'" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$APP_ROOT"
          out="$(php artisan about --only=environment)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq 'production' || { echo "error: APP_ENV is not production" >&2; exit 1; }
          printf '%s\n' "$out" | grep -Eq '\bOFF\b' || { echo "error: APP_DEBUG is not OFF" >&2; exit 1; }
          REMOTE

      - name: Run migrations
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" -p "$REMOTE_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o LogLevel=ERROR \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$REMOTE_USER@$REMOTE_HOST" \
            "APP_ROOT='$APP_ROOT'" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$APP_ROOT"
          php artisan migrate --force --no-interaction
          REMOTE

      - name: Build Laravel caches
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" -p "$REMOTE_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o LogLevel=ERROR \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$REMOTE_USER@$REMOTE_HOST" \
            "APP_ROOT='$APP_ROOT'" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$APP_ROOT"
          php artisan optimize:clear
          php artisan optimize
          php artisan view:cache
          chmod -R u+rwX storage bootstrap/cache
          REMOTE

      - name: Run health checks
        run: |
          set -euo pipefail
          attempts=6
          sleep_seconds=10
          check_http() {
            local name="$1" expected="$2" url="$3"
            local last_code="none"
            for _ in $(seq 1 "$attempts"); do
              last_code="$(curl -s -o /tmp/check_body -w '%{http_code}' -m 20 "$url")" || true
              if [[ "$last_code" == "$expected" ]]; then
                echo "OK: $name"
                return 0
              fi
              sleep "$sleep_seconds"
            done
            echo "::error::Health check failed: $name expected HTTP $expected from $url (last code: $last_code)"
            return 1
          }
          check_json_ok() {
            local name="$1" url="$2"
            local last_code="none"
            for _ in $(seq 1 "$attempts"); do
              last_code="$(curl -s -o /tmp/check_body -w '%{http_code}' -m 20 "$url")" || true
              if [[ "$last_code" == "200" ]] && grep -q '"ok"' /tmp/check_body; then
                echo "OK: $name"
                return 0
              fi
              sleep "$sleep_seconds"
            done
            echo "::error::Health check failed: $name expected HTTP 200 with ok payload from $url (last code: $last_code)"
            return 1
          }
          check_json_ok "health endpoint" "$DEPLOY_BASE_URL/api/v1/health"
          check_http "home page" 200 "$DEPLOY_BASE_URL/"
          check_http "admin auth protected" 401 "$DEPLOY_BASE_URL/api/v1/admin/auth/me"
          check_http "unknown api route" 404 "$DEPLOY_BASE_URL/api/v1/does-not-exist"
          check_http "build manifest" 200 "$DEPLOY_BASE_URL/build/manifest.json"
          asset="$(curl -fsS -m 20 "$DEPLOY_BASE_URL/" | grep -oE '/build/assets/[^"]+' | head -n1)" || asset=""
          if [[ -z "$asset" ]]; then
            echo "::error::Home page does not reference any built frontend asset"
            exit 1
          fi
          check_http "built asset $asset" 200 "$DEPLOY_BASE_URL$asset"

      - name: Record deployment
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" -p "$REMOTE_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes -o LogLevel=ERROR \
            -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" \
            "$REMOTE_USER@$REMOTE_HOST" \
            "APP_ROOT='$APP_ROOT' DEPLOYED_SHA='$DEPLOYED_SHA' GITHUB_REF_NAME='$GITHUB_REF_NAME' GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_ACTOR='$GITHUB_ACTOR' RUN_URL='$RUN_URL'" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$APP_ROOT"
          mkdir -p storage/logs
          entry="{\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"sha\":\"$DEPLOYED_SHA\",\"ref\":\"$GITHUB_REF_NAME\",\"run\":\"$GITHUB_RUN_ID\",\"actor\":\"$GITHUB_ACTOR\",\"run_url\":\"$RUN_URL\",\"migrations\":\"ok\",\"health\":\"ok\",\"result\":\"success\"}"
          printf '%s\n' "$entry" >> storage/logs/deployment.log
          echo "recorded $DEPLOYED_SHA"
          REMOTE

      - name: Write deployment summary
        run: |
          {
            echo "## Deployment summary"
            echo ""
            echo "- Commit: \`$DEPLOYED_SHA\`"
            echo "- Ref: \`$GITHUB_REF_NAME\`"
            echo "- Run: [$GITHUB_RUN_ID]($RUN_URL)"
            echo "- Environment: \`production\`"
            echo "- URL: <$DEPLOY_BASE_URL>"
            echo "- Backend quality: pass"
            echo "- Frontend quality: pass"
            echo "- Migrations: pass"
            echo "- Health checks: pass"
          } >> "$GITHUB_STEP_SUMMARY"